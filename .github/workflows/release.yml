name: Release

# Creates the tag vX.Y.Z and a GitHub release for the version in manifest.json
# when a push to main contains a version that has no tag yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/solaredge_jma/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in manifest.json: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
              echo "::warning::Tag $TAG already exists on another commit; raise the version in manifest.json to publish a new release."
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Wijzigingen"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s' "$GITHUB_SHA"
            fi
          } > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Versie ${TAG#v}" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
